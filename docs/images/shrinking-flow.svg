<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" role="img" aria-label="Delta-debugging counterexample shrinking flow">
  <defs>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrGreen2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="920" height="280" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  <text x="28" y="36" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Delta-Debugging Counterexample Shrinking</text>
  <text x="28" y="56" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">When a seeded fuzz case fails equivalence, diffbench automatically bisects arrays, strings, objects, and numbers.</text>

  <!-- Box 1: Original Fuzz Input -->
  <rect x="28" y="84" width="272" height="162" rx="10" fill="#161b22" stroke="#fb7185" stroke-width="1.3" />
  <text x="44" y="108" fill="#fb7185" font-family="ui-monospace, monospace" font-size="12" font-weight="700">1. FAILING FUZZ CASE #1</text>
  <text x="44" y="132" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11.5">Input (14 elements):</text>
  <text x="44" y="152" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">[-7, 12, 0, 88, 31, -2,</text>
  <text x="44" y="170" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11"> 63, 4, 19, -9, 44, 71, 2, 15]</text>
  <text x="44" y="200" fill="#fda4af" font-family="ui-monospace, monospace" font-size="11">Baseline: 349</text>
  <text x="44" y="218" fill="#fda4af" font-family="ui-monospace, monospace" font-size="11">Candidate: 127 (dropped &gt;= 50)</text>

  <line x1="300" y1="165" x2="340" y2="165" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)" />

  <!-- Box 2: Binary Bisection & Element Reduction -->
  <rect x="344" y="84" width="256" height="162" rx="10" fill="#161b22" stroke="#f59e0b" stroke-width="1.3" />
  <text x="360" y="108" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12" font-weight="700">2. DELTA-DEBUG PROBES</text>
  <text x="360" y="136" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11">[]              &#x2192; equal (skip)</text>
  <text x="360" y="158" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11">[-7..31, -2]    &#x2192; equal (skip)</text>
  <text x="360" y="180" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11">[63, 4, ... 15] &#x2192; MISMATCH!</text>
  <text x="360" y="202" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11">[63]            &#x2192; MISMATCH!</text>
  <text x="360" y="226" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Bisects halves, drops items, halves numbers</text>

  <line x1="600" y1="165" x2="640" y2="165" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen2)" />

  <!-- Box 3: Minimal Counterexample -->
  <rect x="644" y="84" width="248" height="162" rx="10" fill="#052e16" stroke="#10b981" stroke-width="1.3" />
  <text x="660" y="108" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">3. MINIMAL REPRO</text>
  <text x="660" y="138" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="12">Shrunk Args: [[63]]</text>
  <text x="660" y="164" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="11.5">Reason: $: expected 63, got 0</text>
  <text x="660" y="192" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">Baseline : {"ok":true,"value":63}</text>
  <text x="660" y="212" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">Candidate: {"ok":true,"value":0}</text>
</svg>
