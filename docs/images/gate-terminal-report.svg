  <circle cx="394" cy="386" r="6" fill="#38bdf8" stroke="#0d1117" stroke-width="1.5" />
  <text x="562" y="391" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="12">CI [2.99x, 4.83x]  &#x2022;  Cliff's delta = 1.000  &#x2022;  t = 20.892</text>
</svg>
