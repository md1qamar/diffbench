  <text x="464" y="63" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">CORROBORATED</text>

  <text x="24" y="88" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11.5">Hypothesis: Replacing Array.includes with Set yields &gt;= 1.50x speedup</text>

  <text x="24" y="118" fill="#79c0ff" font-family="ui-monospace, monospace" font-size="12" font-weight="700">Criteria:</text>
  <text x="24" y="140" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5">  [PASS]</text>
  <text x="86" y="140" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11.5">Behavioral Equivalence: 0 mismatches (152/152 passed)</text>

  <text x="24" y="162" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5">  [PASS]</text>
  <text x="86" y="162" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11.5">Minimum Median Speedup: 3.47x (expected &gt;= 1.50x)</text>

  <text x="24" y="184" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5">  [PASS]</text>
  <text x="86" y="184" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11.5">Welch's t-test (1-sided): p = 3.091e-24 (&lt;= 0.01)</text>

  <text x="24" y="206" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5">  [PASS]</text>
  <text x="86" y="206" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11.5">Mann-Whitney U (1-sided): p = 1.443e-11 (&lt;= 0.01)</text>

  <text x="24" y="228" fill="#34d399" font-family="ui-monospace, monospace" font-size="11.5">  [PASS]</text>
  <text x="86" y="228" fill="#e6edf3" font-family="ui-monospace, monospace" font-size="11.5">Bootstrap 99% CI Lower: 2.99x (CI [2.99x, 4.83x])</text>

  <!-- Divider -->
  <line x1="24" y1="248" x2="896" y2="248" stroke="#30363d" stroke-width="1" />

  <!-- Latency Bar Comparison -->
