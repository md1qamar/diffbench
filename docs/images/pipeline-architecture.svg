<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="diffbench Falsifiable Optimization Pipeline">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185" />
    </marker>
  </defs>

  <rect width="960" height="360" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Header -->
  <text x="32" y="38" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">diffbench Falsifiable Optimization Pipeline</text>
  <text x="32" y="58" fill="#8b949e" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5">Profile hotspot &#x2192; Formulate hypothesis &#x2192; Fuzz &amp; shrink &#x2192; Interleaved A/B stats &#x2192; Gate verdict</text>

  <!-- Step 1: Profile -->
  <rect x="32" y="88" width="170" height="148" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect x="32" y="88" width="170" height="28" rx="10" fill="#1f2937" />
  <rect x="32" y="106" width="170" height="10" fill="#1f2937" />
  <text x="46" y="107" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">1. PROFILE</text>
  <text x="46" y="138" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Hotspot Discovery</text>
  <text x="46" y="160" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; V8 CPU Inspector (JS)</text>
  <text x="46" y="178" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; cProfile Bridge (Py)</text>
  <text x="46" y="196" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; Ranks self &amp; total %</text>
  <text x="46" y="220" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10.5">diffbench profile</text>

  <line x1="202" y1="162" x2="232" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Step 2: Hypothesis + Fuzzing -->
  <rect x="236" y="88" width="204" height="148" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect x="236" y="88" width="204" height="28" rx="10" fill="#1f2937" />
  <rect x="236" y="106" width="204" height="10" fill="#1f2937" />
  <text x="250" y="107" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">2. EQUIV &amp; SHRINK</text>
  <text x="250" y="138" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Differential Fuzzing</text>
  <text x="250" y="160" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; Seeded DSL + edge cases</text>
  <text x="250" y="178" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; module / cmd / jsonl targets</text>
  <text x="250" y="196" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; Delta-debug counterexample</text>
  <text x="250" y="220" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10.5">diffbench equiv</text>

  <line x1="440" y1="162" x2="470" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Step 3: Interleaved Bench -->
  <rect x="474" y="88" width="214" height="148" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
  <rect x="474" y="88" width="214" height="28" rx="10" fill="#1f2937" />
  <rect x="474" y="106" width="214" height="10" fill="#1f2937" />
  <text x="488" y="107" fill="#f59e0b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">3. INTERLEAVED BENCH</text>
  <text x="488" y="138" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Statistical Rigor</text>
  <text x="488" y="160" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; Randomized A/B + warmup</text>
  <text x="488" y="178" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; Welch t &amp; Mann-Whitney U</text>
  <text x="488" y="196" fill="#8b949e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">&#x2022; Seeded Bootstrap CI</text>
  <text x="488" y="220" fill="#7ee787" font-family="ui-monospace, monospace" font-size="10.5">diffbench bench</text>

  <!-- Branch arrows to Gate Verdicts -->
  <path d="M 688 142 L 732 142 L 732 126 L 758 126" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 688 184 L 732 184 L 732 212 L 758 212" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrowRose)" />

  <!-- Verdict Pass -->
  <rect x="762" y="88" width="166" height="72" rx="10" fill="#052e16" stroke="#10b981" stroke-width="1.5" />
  <text x="776" y="114" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">CORROBORATED</text>
  <text x="776" y="133" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Exit 0 &#x2022; 0 diffs &amp; p &#x2264; &#x03B1;</text>
  <text x="776" y="149" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">CI lower &#x2265; threshold</text>

  <!-- Verdict Fail -->
  <rect x="762" y="176" width="166" height="72" rx="10" fill="#2e0b16" stroke="#f43f5e" stroke-width="1.5" />
  <text x="776" y="202" fill="#fb7185" font-family="ui-monospace, monospace" font-size="12" font-weight="700">FALSIFIED</text>
  <text x="776" y="221" fill="#fecdd3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Exit 1 &#x2022; Drift or noise</text>
  <text x="776" y="237" fill="#fda4af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5">Minimal counterexample</text>

  <!-- Bottom Protocol Strip -->
  <rect x="32" y="266" width="896" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1" />
  <text x="48" y="290" fill="#e6edf3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">Supported Target Runners &amp; Outputs</text>
  <text x="48" y="312" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11.5">Targets: ./mod.mjs#fn  |  cmd:python worker.py  |  jsonl:./rust_worker    Outputs: --json  |  --markdown  |  SKILL.md</text>
</svg>
